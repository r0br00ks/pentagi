# PentAGI on the Dockerfarm through the VPS Coolify (project dev).
# Derived from upstream docker-compose.yml at v2.2.0. Differences:
#   - No host docker.sock. Sandboxes run in a private Docker daemon (dind
#     service) reached over TLS, so PentAGI cannot see or touch other apps'
#     containers on the host. Removing this app removes every sandbox.
#   - pentagi runs as the image's own non-root user (upstream forces root only
#     for the host socket).
#   - UI is published on the Tailscale address only; the compose default is
#     loopback, so a lost variable fails closed. Nothing else is published.
#   - pgexporter dropped (it only feeds the observability stack, not deployed).
#   - Provider config bind mounts dropped: Coolify cannot bind-mount repo files
#     on a managed server, and MiniMax needs no config file.
#   - Images pinned (pentagi 2.2.0, others by digest).
# Record: Central-AI-Brain 02_Projects/Cybersecurity-Tools/PentAGI/

volumes:
  pentagi-data:
  pentagi-ssl:
  pentagi-postgres-data:
  scraper-ssl:
  dind-data:
  dind-certs-ca:
  dind-certs-client:
  ollama-models:

services:
  pentagi:
    image: vxcontrol/pentagi@sha256:0abdf8e9e9e19839dccc5d2ec365060e5c41941588279897cabd628d29a9afd7  # 2.2.0-ce.hcffed94, rev cffed94, built 2026-10-22
    restart: unless-stopped
    hostname: pentagi
    ports:
      - "${PENTAGI_BIND_IP:-127.0.0.1}:${PENTAGI_HOST_PORT:-2923}:8443"
    depends_on:
      pgvector:
        condition: service_healthy
      dind:
        condition: service_healthy
    environment:
      - DEBUG=false
      - ASK_USER=false
      - PUBLIC_URL=${PENTAGI_PUBLIC_URL:-https://localhost:8443}
      - CORS_ORIGINS=${PENTAGI_PUBLIC_URL:-https://localhost:8443}
      - COOKIE_SIGNING_SALT=${PENTAGI_COOKIE_SALT:?set PENTAGI_COOKIE_SALT}
      - SERVER_PORT=8443
      - SERVER_HOST=0.0.0.0
      - SERVER_USE_SSL=true
      # LLM: MiniMax, key from Bitwarden MINIMAX_API_KEY via Coolify env
      - MINIMAX_API_KEY=${PENTAGI_MINIMAX_API_KEY:-}
      - MINIMAX_SERVER_URL=https://api.minimax.io/v1
      # LLM: DeepSeek, key from Bitwarden DEEPSEEK_API_KEY via Coolify env (added as a selectable second provider; MiniMax stays default)
      - DEEPSEEK_API_KEY=${PENTAGI_DEEPSEEK_API_KEY:-}
      # LLM: Windows Ollama (local, no key) as a selectable provider for its local models
      - OLLAMA_SERVER_URL=${PENTAGI_OLLAMA_SERVER_URL:-http://100.103.249.68:11434}
      # LLM: Ollama Cloud via the generic OpenAI-compatible provider (hosted big models; key from Coolify env)
      - LLM_SERVER_URL=${PENTAGI_LLM_SERVER_URL:-https://ollama.com/v1}
      - LLM_SERVER_KEY=${PENTAGI_LLM_SERVER_KEY:-}
      - LLM_SERVER_API_TYPE=${PENTAGI_LLM_SERVER_API_TYPE:-openai}
      - LLM_SERVER_MODEL=${PENTAGI_LLM_SERVER_MODEL:-gpt-oss:120b}
      # Embeddings: local Ollama (no key, nothing leaves the host). MiniMax has
      # no OpenAI-compatible embedding API, so it cannot be reused for this.
      - EMBEDDING_PROVIDER=${PENTAGI_EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_URL=${PENTAGI_EMBEDDING_URL:-http://ollama:11434}
      - EMBEDDING_KEY=${PENTAGI_EMBEDDING_KEY:-}
      - EMBEDDING_MODEL=${PENTAGI_EMBEDDING_MODEL:-nomic-embed-text}
      # Search: self-hosted SearXNG primary (no key); DuckDuckGo stays as fallback.
      - SEARXNG_URL=${PENTAGI_SEARXNG_URL:-http://searxng:8080}
      - DUCKDUCKGO_ENABLED=true
      - SPLOITUS_ENABLED=true
      - SCRAPER_PRIVATE_URL=https://pentagi:${PENTAGI_SCRAPER_PASSWORD:?set PENTAGI_SCRAPER_PASSWORD}@scraper/
      - DATABASE_URL=postgres://pentagi:${PENTAGI_POSTGRES_PASSWORD:?set PENTAGI_POSTGRES_PASSWORD}@pgvector:5432/pentagidb?sslmode=disable
      # Private Docker daemon for sandboxes
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/opt/pentagi/docker/ssl
      - DOCKER_INSIDE=false
      - DOCKER_NET_ADMIN=true
      - DOCKER_PUBLIC_IP=0.0.0.0
    volumes:
      - pentagi-data:/opt/pentagi/data
      - pentagi-ssl:/opt/pentagi/ssl
      - dind-certs-client:/opt/pentagi/docker/ssl:ro
    logging:
      options:
        max-size: 50m
        max-file: "7"

  dind:
    image: docker:29.9.2-dind
    restart: unless-stopped
    hostname: dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - dind-data:/var/lib/docker
      - dind-certs-ca:/certs/ca
      - dind-certs-client:/certs/client
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging:
      options:
        max-size: 50m
        max-file: "7"

  pgvector:
    image: vxcontrol/pgvector@sha256:09afd689127bdb42319a133b2ef7cd4318b7ebda58412644975d6eacd2367fb0
    restart: unless-stopped
    hostname: pgvector
    environment:
      POSTGRES_USER: pentagi
      POSTGRES_PASSWORD: ${PENTAGI_POSTGRES_PASSWORD:?set PENTAGI_POSTGRES_PASSWORD}
      POSTGRES_DB: pentagidb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentagi"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - pentagi-postgres-data:/var/lib/postgresql/data
    logging:
      options:
        max-size: 50m
        max-file: "7"

  scraper:
    image: vxcontrol/scraper@sha256:4a3b0f179ab29003313167877ee2f6ab74c89f3fcb1ce108e648ca1ffadc51b7
    restart: unless-stopped
    hostname: scraper
    environment:
      - MAX_CONCURRENT_SESSIONS=4
      - USERNAME=pentagi
      - PASSWORD=${PENTAGI_SCRAPER_PASSWORD:?set PENTAGI_SCRAPER_PASSWORD}
    volumes:
      - scraper-ssl:/usr/src/app/ssl
    shm_size: 2g
    logging:
      options:
        max-size: 50m
        max-file: "7"

  # Local embedding model for PentAGI's vector memory and knowledge search.
  # CPU only, no API key, no data leaves the host. Model persists in a volume,
  # so it is pulled once. pentagi has no hard dependency on it: if the pull is
  # slow or fails, flows still run, embeddings just come online when it is ready.
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    hostname: ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama list | grep -q nomic-embed-text || ollama pull nomic-embed-text
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 2g
    logging:
      options:
        max-size: 50m
        max-file: "7"

  # Self-hosted metasearch so web_search does not depend on DuckDuckGo's bot
  # check (which returned HTTP 202 and left agents with no search). The image
  # reads /etc/searxng/settings.yml; Coolify cannot mount a repo file on a
  # managed server, so the settings are written at start with JSON output on
  # (PentAGI requests format=json) and the rate limiter off.
  searxng:
    image: searxng/searxng:2026.11.2-cccbc9e15
    restart: unless-stopped
    hostname: searxng
    environment:
      - SEARXNG_SECRET=${PENTAGI_SEARXNG_SECRET:?set PENTAGI_SEARXNG_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/searxng
        cat > /etc/searxng/settings.yml <<EOF
        use_default_settings: true
        server:
          secret_key: "$${SEARXNG_SECRET}"
          limiter: false
          image_proxy: false
        search:
          formats:
            - html
            - json
        EOF
        exec /usr/local/searxng/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8080/search?q=ping&format=json' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    logging:
      options:
        max-size: 50m
        max-file: "7"
